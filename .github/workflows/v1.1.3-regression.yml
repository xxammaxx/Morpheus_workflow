name: v1.1.3 regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Root collection
        run: python -m pytest --collect-only -q
      - name: Root suite
        run: python -m pytest -q
      - name: Contract validation
        run: python runtime/tests/test_contracts.py
      - name: Validator equivalence
        run: python runtime/tests/test_validator_equivalence.py
      - name: Compile Python
        run: python -m compileall -q adapter runtime dashboard scripts
      - name: Validate workflow JSON
        run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('n8n/workflows/autodev').glob('*.json')]"
      - name: Diff check
        run: git diff --check
