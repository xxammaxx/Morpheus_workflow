[pytest]
# Canonical product/regression suite.  The evidence trees below remain
# versioned and are exercised by their own trajectory/evaluation runners, but
# are not the product suite: they contain isolated historical executable
# tasks, generated benchmark fixtures, and intentionally red tasks whose
# imports assume the fixture directory as the process root.
testpaths =
    runtime/tests
    dashboard/tests
    evidence/tests/hamh
    scripts
pythonpath =
    runtime
    dashboard
    scripts
