<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morpheus Control Tower</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><header class="top"><div><p class="eyebrow">MORPHEUS</p><h1>CONTROL TOWER</h1></div><div id="freshness" role="status">Awaiting authentication</div></header>
<main><section id="login" class="panel"><h2>Viewer authentication</h2><p>Enter the LAN viewer token. It is kept in this tab session only.</p><form id="login-form"><label for="token">Control Tower viewer token</label><input id="token" type="password" autocomplete="off" required><button>Open dashboard</button><p id="login-error" class="error" role="alert"></p></form></section>
<section id="dashboard" hidden><nav class="tabs" aria-label="Dashboard views"><button data-view="overview">Overview</button><button data-view="runs">Runs</button><button data-view="providers">Providers</button></nav><section id="overview-view" class="view"><div class="cards" id="health"></div><div class="grid"><article class="panel"><h2>Run summary</h2><div id="counts" class="metrics"></div></article><article class="panel"><h2>Free provider pool</h2><div id="pool"></div></article></div><article class="panel"><h2>Recent runs</h2><div id="recent"></div></article><article class="panel"><h2>Active alerts</h2><div id="alerts"></div></article></section><section id="runs-view" class="view" hidden><article class="panel"><h2>Runs</h2><label for="run-search">Search run ID</label><input id="run-search" type="search"><div id="runs"></div></article><article id="detail" class="panel" hidden></article></section><section id="providers-view" class="view" hidden><article class="panel"><h2>Provider runtime</h2><div id="providers"></div></article></section></section></main><script src="/static/app.js" defer></script></body></html>
